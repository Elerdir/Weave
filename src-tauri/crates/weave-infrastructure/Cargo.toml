[package]
name = "weave-infrastructure"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Weave infrastructure layer — SQLite, keychain, HTTP adaptery pro LLM a ComfyUI."

[features]
# Vestavěná inference přes llama.cpp (llama-cpp-2). CPU základ + GPU akcelerace
# přes feature flagy. NEbuildí se v CI (potřebuje CMake + GPU SDK).
#
# CUDA tu záměrně není. Vulkan pokrývá NVIDII stejně jako AMD a Intel, má
# o řád menší SDK a u modelů větších než VRAM stejně nerozhoduje backend, ale
# rozložení modelu (viz `llm::offload_plan`). CUDA v projektu zůstává jen pro
# ComfyUI, které si ji instaluje samo do vlastního Python prostředí.
llm-embedded = ["dep:llama-cpp-2", "dep:encoding_rs"]
llm-metal = ["llm-embedded", "llama-cpp-2/metal"]
llm-vulkan = ["llm-embedded", "llama-cpp-2/vulkan"]

[dependencies]
weave-domain = { path = "../weave-domain" }
weave-application = { path = "../weave-application" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
reqwest = { workspace = true }
sqlx = { workspace = true }
keyring = "4"
base64 = "0.22"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
genpdf = "0.2"
# `openmp` NENÍ volitelný luxus: `default-features = false` ji tiše vypne
# a ggml si pak řídí vlákna samo. U hybridního MoE běhu je na každý token
# desítky přepnutí CPU↔GPU a bez OpenMP se při každém probouzí threadpool
# znovu. Naměřeno na gemma-4-26B-A4B: bez OpenMP 8,4 t/s, s ní 20,7 t/s.
# Na čistě CPU běhu se to skoro neprojeví, takže se to snadno přehlédne.
#
# 0.1.151 kvůli `add_cpu_buft_override()`, bez kterého nejde nechat experty
# v RAM (viz `llm::offload_plan`).
llama-cpp-2 = { version = "0.1.151", optional = true, default-features = false, features = [
    "sampler",
    "openmp",
] }
encoding_rs = { version = "0.8", optional = true }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
png = { workspace = true }
tokio-tungstenite = "0.29"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { workspace = true }
