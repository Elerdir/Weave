name: release

# Spustí se po pushnutí tagu verze (např. v0.1.0). Sestaví Windows instalátor,
# podepíše ho Tauri updater klíčem a nahraje do UpdateHubu jako Draft release.
# Publikace je ruční v admin UI UpdateHubu (draft → publish).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Verze bez 'v' (např. 0.1.0)"
        required: true
  # Volá dispatch.yml (Dispatch konzole): tag už existuje, platformy vybírá uživatel.
  workflow_call:
    inputs:
      tag:
        description: "Tag k vydání, např. v0.3.0"
        type: string
        required: true
      platforms:
        description: "Čárkou oddělené: windows,macos"
        type: string
        default: "windows,macos"

env:
  SQLX_OFFLINE: "true"

jobs:
  # Společně pro oba buildy: z čeho se staví, jaká je verze, které platformy a poznámky k vydání.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      version: ${{ steps.meta.outputs.version }}
      windows: ${{ steps.meta.outputs.windows }}
      macos: ${{ steps.meta.outputs.macos }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve ref, version and platforms
        id: meta
        shell: bash
        env:
          CALL_TAG: ${{ inputs.tag }}
          PLATFORMS: ${{ inputs.platforms || 'windows,macos' }}
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$CALL_TAG" ]; then                 # z dispatch.yml
            tag="$CALL_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then   # push tagu
            tag="$GITHUB_REF_NAME"
          else                                        # ruční spuštění bez tagu: staví se větev
            tag=""
          fi

          if [ -n "$tag" ]; then
            version="${tag#v}"
            # Tag musí sedět se soubory, jinak by se vydala aplikace s jinou verzí, než hlásí UpdateHub.
            pkg=$(node -p "require('./package.json').version")
            conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
            cargo=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
            if [ "$version" != "$pkg" ] || [ "$version" != "$conf" ] || [ "$version" != "$cargo" ]; then
              echo "::error::Verze neodpovídá tagu $tag: package.json=$pkg, tauri.conf.json=$conf, Cargo.toml=$cargo. Spusť 'node scripts/bump-version.mjs $version'."
              exit 1
            fi
          else
            version="$MANUAL_VERSION"
          fi

          has() { [[ ",$PLATFORMS," == *",$1,"* ]] && echo true || echo false; }
          {
            echo "ref=${tag:-$GITHUB_REF}"
            echo "version=$version"
            echo "windows=$(has windows)"
            echo "macos=$(has macos)"
          } >> "$GITHUB_OUTPUT"
          echo "ref=${tag:-$GITHUB_REF} version=$version platforms=$PLATFORMS"

      - name: Release notes from git log
        id: notes
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.ref }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            notes=$(bash scripts/release-notes.sh "$TAG")
          else
            notes="Weave $VERSION"
          fi
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$notes"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$notes"

  build-windows:
    name: build-windows
    needs: prepare
    if: needs.prepare.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install deps
        run: pnpm install

      # Vulkan SDK je potřeba jen k BUILDU (hlavičky, vulkan-1.lib, glslc pro
      # shadery). Uživatel instalátoru ho nepotřebuje — runtime vulkan-1.dll
      # je součástí ovladače grafiky.
      #
      # Ninja proto, že MSBuild padá při kompilaci Vulkan shaderů
      # ("cannot find the batch label VCEnd"): llama-cpp-sys-2 si pro Vulkan
      # vypíná TrackFileAccess a to rozbije paralelní custom build kroky.
      - name: Install Vulkan SDK + Ninja
        shell: pwsh
        run: |
          choco install vulkan-sdk ninja -y --no-progress
          $sdk = (Get-ChildItem "C:\VulkanSDK" -Directory |
                  Sort-Object Name -Descending | Select-Object -First 1).FullName
          if (-not $sdk) { throw "Vulkan SDK se nenainstaloval do C:\VulkanSDK" }
          "VULKAN_SDK=$sdk"        | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_GENERATOR=Ninja"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdk\Bin"               | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "VULKAN_SDK=$sdk"

      # Sestaví frontend (vite) + Rust release + Windows bundly (NSIS + MSI).
      # createUpdaterArtifacts v tauri.conf.json vygeneruje k instalátoru .sig.
      #
      # --features llm-vulkan NENÍ volitelný luxus: vestavěná inference je
      # jediný backend, který appka má. Build bez ní vyrobí aplikaci, která
      # se nainstaluje a spustí, ale na první zprávu odpoví, že není nastavený
      # žádný AI model.
      #
      # Ninja potřebuje cl.exe v PATH, proto se napřed volá vcvars64. Cestu
      # k Visual Studiu hledá vswhere, ať to nezávisí na verzi image runneru.
      - name: Build Tauri app (Vulkan)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          pnpm tauri build --features llm-vulkan
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Nahraje NSIS instalátor + jeho podpis do UpdateHubu. Verze se bere z tagu
      # (bez 'v') nebo ze vstupu workflow_dispatch. UpdateHub vrátí .sig zpět
      # v Tauri manifestu, takže klient updateru ověří Ed25519 podpis.
      - name: Upload to UpdateHub
        shell: bash
        env:
          UPDATEHUB_URL: ${{ secrets.UPDATEHUB_URL }}
          UPDATEHUB_CI_TOKEN: ${{ secrets.UPDATEHUB_CI_TOKEN }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"

          INSTALLER=$(ls target/release/bundle/nsis/*-setup.exe | head -n1)
          SIGNATURE=$(cat "${INSTALLER}.sig")
          echo "Nahrávám $INSTALLER (verze $VERSION)"

          curl -f -X POST "${UPDATEHUB_URL}/api/ci/apps/weave/releases" \
            -H "X-UpdateHub-Token: ${UPDATEHUB_CI_TOKEN}" \
            -F "file=@${INSTALLER}" \
            -F "signature=${SIGNATURE}" \
            -F "version=${VERSION}" \
            -F "platform=windows" \
            -F "arch=x64" \
            -F "channel=stable" \
            -F "release_notes=${RELEASE_NOTES}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: weave-windows-installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
          retention-days: 14

  # macOS (Apple Silicon) build s vestavěnou Metal GPU inferencí. Runner
  # macos-latest je arm64 a má Xcode CLT + cmake, takže llama.cpp Metal build
  # projde bez dalšího setupu. Aplikace není podepsaná Apple Developer ID
  # (Gatekeeper při prvním spuštění vyžaduje pravý klik → Otevřít) — updater
  # podpis (Ed25519) je na tom nezávislý a funguje.
  build-macos:
    name: build-macos
    needs: prepare
    if: needs.prepare.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install deps
        run: pnpm install

      - name: Build Tauri app (Metal)
        run: pnpm tauri build --features llm-metal
        env:
          # llama.cpp používá std::filesystem (macOS 10.15+); výchozí cíl Tauri je 10.13
          # a build padá na "'path' is unavailable". Apple Silicon stejně vyžaduje 11.0.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Updater artefakt na macOS je .app.tar.gz + .sig; ke stažení pro
      # uživatele se navíc nahrává .dmg.
      - name: Upload to UpdateHub
        shell: bash
        env:
          UPDATEHUB_URL: ${{ secrets.UPDATEHUB_URL }}
          UPDATEHUB_CI_TOKEN: ${{ secrets.UPDATEHUB_CI_TOKEN }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"

          BUNDLE=$(ls target/release/bundle/macos/*.app.tar.gz | head -n1)
          SIGNATURE=$(cat "${BUNDLE}.sig")
          echo "Nahrávám $BUNDLE (verze $VERSION)"

          curl -f -X POST "${UPDATEHUB_URL}/api/ci/apps/weave/releases" \
            -H "X-UpdateHub-Token: ${UPDATEHUB_CI_TOKEN}" \
            -F "file=@${BUNDLE}" \
            -F "signature=${SIGNATURE}" \
            -F "version=${VERSION}" \
            -F "platform=macos" \
            -F "arch=arm64" \
            -F "channel=stable" \
            -F "release_notes=${RELEASE_NOTES}"

      # .dmg je instalátor pro lidi (web ho nabízí ke stažení); updater ho nepoužívá,
      # proto bez podpisu — Tauri manifest bere jen soubory s podpisem.
      - name: Upload dmg to UpdateHub
        shell: bash
        env:
          UPDATEHUB_URL: ${{ secrets.UPDATEHUB_URL }}
          UPDATEHUB_CI_TOKEN: ${{ secrets.UPDATEHUB_CI_TOKEN }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"

          DMG=$(ls target/release/bundle/dmg/*.dmg | head -n1)
          echo "Nahrávám $DMG (verze $VERSION)"

          curl -f -X POST "${UPDATEHUB_URL}/api/ci/apps/weave/releases" \
            -H "X-UpdateHub-Token: ${UPDATEHUB_CI_TOKEN}" \
            -F "file=@${DMG}" \
            -F "version=${VERSION}" \
            -F "platform=macos" \
            -F "arch=arm64" \
            -F "channel=stable" \
            -F "release_notes=${RELEASE_NOTES}"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: weave-macos-dmg
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 14
