name: Dispatch release

# Forgejo Actions: bump ve commitu jen pod tagem (main se neposouva), tag pushne release-bot
# (RELEASE_TOKEN); Windows instalator ve stejnem behu (slozena akce .forgejo/actions/windows-installer).
# macOS se vrati s Mac runnerem (etapa F5).

# Spousti Dispatch (https://dispatch.niderle.cz) pres Forgejo API
# (workflow_dispatch). Kontrakt se vsemi aplikacemi v Dispatchi:
#   - vstupy version, platforms, dispatch_id
#   - dispatch_id v run-name (podle nej Dispatch dohleda tenhle beh)
#
# main je chranena (PR + povinne kontroly), takze bump verze NEMUZE pushnout
# commit do main. Misto toho vznikne commit s novou verzi jen pod tagem
# (odpojeny od vetve): tag v<verze> ukazuje na main + bump verze, vetev main
# se nemeni. release.yml pak checkoutuje tag a verze v souborech sedi s tagem.
# Soubory v main se verzi dorovnaji, az kdyz je nekdo v PR slouci.
# Tag od release-bot release.yml preskakuje, build nebezi dvakrat.
#
# Lze spustit i rucne (Actions -> Dispatch release -> Spustit).

run-name: Release ${{ inputs.version }} [${{ inputs.dispatch_id || 'manual' }}]

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nova verze bez v (napr. 0.3.0)"
        type: string
        required: true
      platforms:
        description: "Carkou oddelene: windows,macos"
        type: string
        default: "windows"
      dispatch_id:
        description: "Korelacni ID z Dispatche (rucne nech prazdne)"
        type: string
        default: ""

concurrency:
  group: dispatch-release
  cancel-in-progress: false

env:
  # sqlx pouziva offline cache (.sqlx/) - build nepotrebuje zivou DB
  SQLX_OFFLINE: "true"

jobs:
  tag:
    name: Bump version and tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Validate inputs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' neni platna semver verze"; exit 1
          fi
          if ! [[ "$PLATFORMS" =~ ^(windows|macos)(,(windows|macos))*$ ]]; then
            echo "::error::Neplatne platformy '$PLATFORMS' (Weave: windows, macos)"; exit 1
          fi
          if ! [[ ",$PLATFORMS," == *",windows,"* ]]; then
            echo "::error::macOS zatim nema runner - vydavej s platformou windows"; exit 1
          fi
          [[ ",$PLATFORMS," == *",macos,"* ]] && echo "::warning::macOS zatim nema runner - stavi se jen Windows."
          true

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Tag must not exist yet
        shell: bash
        env:
          TAG: v${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG uz existuje - zvol vyssi verzi"; exit 1
          fi

      # Bump v odpojenem commitu, push jen tagu: main je chranena a verze v ni se dorovna v PR.
      - name: Bump version in a tag-only commit
        id: tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TAG: v${{ inputs.version }}
        run: |
          git config user.name  "release-bot"
          git config user.email "release-bot@git.niderle.cz"
          git switch --detach
          node scripts/bump-version.mjs "$VERSION"
          git add package.json src-tauri/tauri.conf.json Cargo.toml Cargo.lock
          git commit -m "chore(release): $TAG"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: tag
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      # fetch-depth 0: poznamky k vydani se skladaji z git logu od predchoziho tagu.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0

      - uses: ./.forgejo/actions/windows-installer
        with:
          version: ${{ inputs.version }}
          tag: ${{ needs.tag.outputs.tag }}
          signing-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          signing-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          updatehub-url: ${{ secrets.UPDATEHUB_URL }}
          updatehub-token: ${{ secrets.UPDATEHUB_CI_TOKEN }}
