name: release

# Vydani z existujiciho tagu: rucni push tagu vX.Y.Z nebo opakovani (workflow_dispatch se
# vstupem tag, napr. kdyz selze upload do UpdateHubu). Bezne vydani jde pres Dispatch ->
# dispatch.yml; tagy od release-bot se tady preskakuji (ty uz stavi dispatch.yml).
# macOS se vrati s Mac runnerem (etapa F5).
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY(+_PASSWORD), UPDATEHUB_CI_TOKEN (repo),
# UPDATEHUB_URL (organizace elerdir).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag k (znovu)vydani, napr. v0.3.0"
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  # sqlx pouziva offline cache (.sqlx/) - build nepotrebuje zivou DB
  SQLX_OFFLINE: "true"

jobs:
  windows:
    name: Windows installer
    if: github.actor != 'release-bot'
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Tag == package.json == tauri.conf.json == Cargo.toml
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$v" != "$pkg" ] || [ "$v" != "$conf" ] || [ "$v" != "$cargo" ]; then
            echo "::error::Verze neodpovida tagu $TAG: package.json=$pkg, tauri.conf.json=$conf, Cargo.toml=$cargo"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Slozena akce z aktualni vetve, ne z tagu: opakovani stareho vydani dostane opravy CI.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _ci
          sparse-checkout: .forgejo/actions

      - uses: ./_ci/.forgejo/actions/windows-installer
        with:
          version: ${{ steps.version.outputs.version }}
          tag: ${{ steps.version.outputs.tag }}
          signing-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          signing-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          updatehub-url: ${{ secrets.UPDATEHUB_URL }}
          updatehub-token: ${{ secrets.UPDATEHUB_CI_TOKEN }}
